[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-underwrite"
version = "0.1.0"
description = "Autonomous multimodal document AI and credit underwriting engine deployed on Modal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ujjwal Singh" }
]

# Base install = what the API gateway needs to run (no GPU stack).
dependencies = [
    "modal>=0.63.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",   # FastAPI UploadFile / Form
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",      # .env loading for pydantic-settings
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
# GPU inference worker (installed inside the Modal gpu_image)
inference = [
    "vllm>=0.4.0",
]

# LoRA training (installed inside the Modal gpu_image)
train = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "peft>=0.10.0",
]

# Offline teacher-data generation
data = [
    "groq>=0.5.0",
]

# Gradio underwriter console
ui = [
    "gradio>=4.0.0",
    "requests>=2.31.0",
]

# Development, testing, and linting suite
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",             # FastAPI TestClient
    "groq>=0.5.0",               # imported by tests/test_dataset.py
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are designed to be used as argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.File", "fastapi.Form",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]