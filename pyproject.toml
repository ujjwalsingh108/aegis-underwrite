[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-underwrite"
version = "0.1.0"
description = "Autonomous multimodal document AI and credit underwriting engine deployed on Modal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ujjwal Singh" }
]

dependencies = [
    # Serverless Orchestration & Runtime
    "modal>=0.63.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",

    # Schema Validation & Settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Core ML, Transformers & Embeddings
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # Multimodal Vision & Document Parsing
    "docling>=2.0.0",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.3.0",

    # Utilities & HTTP
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# Training & Optimization dependencies (used inside Modal GPU training images)
train = [
    "peft>=0.10.0",
    "trl>=0.8.6",
    "bitsandbytes>=0.43.0",
]

# Development, testing, and linting suite
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"